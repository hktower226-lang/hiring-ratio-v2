<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#122e2a"><title>경기지역본부 · 채용 현황</title>
<style>
:root { --ink:#17342e; --muted:#73817c; --bg:#f4f6f3; --line:#e4e9e3; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif; line-height:1.5; }
button,input { font:inherit; }
button { cursor:pointer; }
button:focus-visible,input:focus-visible { outline:3px solid #d4a84b; outline-offset:3px; }
.app { max-width:680px; margin:auto; padding-bottom:calc(100px + env(safe-area-inset-bottom)); }
header { background:#122e2a; color:white; padding:32px 22px 27px; border-radius:0 0 30px 30px; }
header small { color:#b6d0bd; letter-spacing:2px; font-size:11px; }
h1 { font-size:27px; letter-spacing:-1px; margin:9px 0 6px; }
header p { margin:0; color:#c1d1c8; font-size:13px; }
.tag { display:inline-block; margin-top:20px; border:1px solid #4c675d; border-radius:20px; padding:5px 11px; font-size:11px; }
main { padding:22px 18px; }
h2 { font-size:20px; letter-spacing:-.6px; margin:0; overflow-wrap:anywhere; }
h3 { margin:0; font-size:16px; }
.eyebrow { font-size:10px; color:#76877c; letter-spacing:1.8px; font-weight:700; }
.section-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:15px; gap:12px; }
.sub { color:var(--muted); font-size:12px; margin:3px 0; }
.section-head > .sub { flex-shrink:0; }
.count { font-size:11px; background:#e5ecdf; border-radius:20px; padding:4px 9px; white-space:nowrap; }
.card { background:white; border:1px solid var(--line); border-radius:21px; padding:20px; margin-bottom:15px; }
.total { display:flex; justify-content:space-between; align-items:center; gap:12px; }
.total strong { font-size:44px; letter-spacing:-2px; line-height:1.2; }
.total strong small { font-size:15px; letter-spacing:0; margin-left:6px; font-weight:500; }
.pill { display:inline-block; background:#edf2e8; color:#526449; border-radius:12px; padding:8px 12px; font-size:12px; }
.summary-tags { display:flex; flex-direction:column; align-items:flex-end; gap:8px; }
.stack { display:flex; height:11px; border-radius:20px; overflow:hidden; margin:20px 0; }
.stack span { min-width:0; }
.stats { display:grid; grid-template-columns:repeat(3,1fr); gap:18px 10px; }
.stat-label { font-size:12px; color:#68766d; display:flex; gap:5px; align-items:center; }
.dot { width:7px; height:7px; border-radius:50%; display:inline-block; flex-shrink:0; }
.stat-value { font-size:18px; font-weight:750; margin-top:4px; }
.stat-value small { font-size:11px; color:#6b7970; font-weight:500; margin-left:5px; }
.notice { font-size:12px; background:#fff5df; color:#785c27; border-radius:12px; padding:12px; margin-top:16px; }
.notice p { margin:0; }
.search-area { margin-bottom:20px; }
.search { width:100%; border:1px solid var(--line); background:white; border-radius:13px; padding:13px 14px; color:var(--ink); }
.search-help { font-size:11px; color:var(--muted); margin:7px 2px 0; }
.group-list { display:grid; gap:9px; }
.group { display:grid; grid-template-columns:minmax(0,1fr) auto 10px; align-items:center; gap:10px; width:100%; min-height:76px; border:1px solid var(--line); background:white; text-align:left; border-radius:16px; padding:14px; color:var(--ink); }
.group-title { min-width:0; display:flex; flex-direction:column; align-items:flex-start; gap:6px; }
.group-name { font-size:15px; font-weight:750; overflow-wrap:anywhere; }
.group-metrics { display:flex; flex-direction:column; gap:4px; }
.group-metric { display:block; color:#65766b; font-size:11px; white-space:nowrap; }
.group-metric strong { margin-left:4px; font-size:12px; }
.group-metric.han strong { color:#32694d; }
.group-metric.min strong { color:#4e7c96; }
.group-arrow { font-size:20px; color:#81947e; }
.group:hover { border-color:#71977b; }
.group.selected { background:#e7efdf; border-color:#69835d; }
.company-status { display:inline-block; border-radius:6px; font-size:10px; font-weight:700; padding:3px 7px; white-space:nowrap; }
.company-status.friendly { background:#e1f0e4; color:#326744; }
.company-status.uncooperative { background:#fbece5; color:#9b5339; }
.rental-guide { font-size:11px; color:#68766d; background:#eaf0e4; border-radius:10px; padding:11px 12px; margin:0 0 14px; }
.rental-summary { border-top:1px solid var(--line); margin-top:18px; padding-top:16px; }
.rental-value { font-size:32px; font-weight:750; color:#32694d; margin-top:3px; }
.rental-value small { font-size:14px; font-weight:500; margin:0 10px 0 4px; }
.rental-value span { font-size:22px; }
.choose-hint { text-align:center; color:var(--muted); font-size:12px; padding:22px 12px; margin:0; }
.selection { margin:24px 0 14px; scroll-margin-top:18px; }
.site-name { font-size:17px; line-height:1.45; letter-spacing:-.5px; overflow-wrap:anywhere; margin:10px 0 12px; }
.site-top { display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:11px; color:#61766a; }
.badge { background:#f0f3ed; border-radius:7px; padding:4px 7px; }
.meta { font-size:12px; color:#6b7a70; display:grid; grid-template-columns:45px 1fr; gap:5px; margin-bottom:15px; }
.meta span:nth-child(even) { color:#344d40; overflow-wrap:anywhere; }
.site-counts { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; border-top:1px solid var(--line); padding-top:14px; font-size:11px; color:#66766a; }
.site-counts b { display:block; font-size:14px; color:var(--ink); margin-top:3px; }
.site-counts small { font-size:10px; font-weight:400; color:#718075; }
.note { font-size:11px; color:#8b6625; margin:12px 0 0; }
.empty { text-align:center; padding:32px; color:#73817c; font-size:13px; }
.footnote { font-size:11px; color:#7f8a80; margin:18px 3px; line-height:1.8; }
nav { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:680px; display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); background:#ffffffed; backdrop-filter:blur(16px); border-top:1px solid var(--line); padding:10px 8px calc(10px + env(safe-area-inset-bottom)); z-index:10; }
nav button { border:0; background:none; color:#7d887e; border-radius:12px; padding:8px 2px; font-size:11px; }
nav button.active { background:#eaf0e3; color:#244e39; font-weight:750; }
nav svg { display:block; margin:0 auto 4px; width:21px; height:21px; fill:none; stroke:currentColor; stroke-width:1.6; }
@media(min-width:600px) { main { padding:28px; } header { padding:38px 30px; } .group-metrics { flex-direction:row; gap:22px; } .group { min-height:72px; padding:16px 18px; } }
@media(prefers-reduced-motion:no-preference) { .card { animation:appear .2s ease-out; } @keyframes appear { from { opacity:.3; transform:translateY(5px); } to { opacity:1; transform:translateY(0); } } }
.separate-guide { background:#e9eff5; border:1px solid #dbe5ef; border-radius:14px; padding:13px 14px; margin-bottom:16px; color:#405d75; font-size:12px; }
.separate-guide strong { display:block; margin-bottom:4px; }
.semiconductor-tabs { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin-bottom:18px; }
.semiconductor-tabs button { border:1px solid var(--line); border-radius:12px; background:white; color:#6a7d72; padding:12px 6px; min-height:46px; font-size:12px; }
.semiconductor-tabs button[aria-pressed="true"] { background:#173d33; border-color:#173d33; color:white; font-weight:700; }
.semiconductor-tabs span { font-size:10px; margin-left:4px; }
.assigned-guide { font-size:12px; padding:14px; background:#fff5df; color:#785c27; border-radius:12px; margin:0 0 18px; }
.semiconductor-label { background:#e9eff5; color:#405d75; }
.assigned-label { background:#fff5df; color:#785c27; }
.statistic-panel { margin-top:24px; }
.statistic-heading { margin:0 2px 12px; }
.statistic-heading h2 { font-size:18px; line-height:1.5; }
.statistic-heading p { font-size:12px; color:var(--muted); margin:5px 0 0; }
.statistic-panel[data-statistic="overall-including-semiconductor"] .card { border-color:#a9bfaa; }
.statistic-panel[data-statistic="semiconductor-including-assigned"] .card { border-color:#b3c6d8; }
.rental-search-area { background:#eef3eb; border:1px solid #dce7d6; border-radius:15px; padding:14px; margin-bottom:18px; }
.rental-search-area label { display:block; font-size:13px; font-weight:700; margin-bottom:8px; }
.rental-search-area .search-help { line-height:1.6; }
.rental-result-label { font-size:12px; overflow-wrap:anywhere; color:#405d4e; margin:18px 2px 0; }
.rental-no-results { border:1px dashed #d8e2d1; border-radius:14px; margin:20px 0; background:white; }
.ratio-basis { border:1px solid #dbe5d6; border-radius:16px; background:#eaf0e4; padding:15px; margin:0 0 18px; font-size:12px; color:#435c47; line-height:1.8; }
.ratio-basis strong { display:block; color:#274e38; font-size:13px; margin-bottom:4px; }
.ratio-chart-card { padding:20px 14px 16px; }
.ratio-overview-legend { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px 7px; margin:15px 0 20px; }
.ratio-overview-legend span { display:flex; align-items:center; gap:5px; min-width:0; font-size:10px; color:#62756a; line-height:1.5; }
.ratio-chart { display:block; width:100%; height:auto; overflow:visible; }
.ratio-chart-note { margin:12px 2px 0; color:#788679; font-size:11px; line-height:1.8; }
.ratio-division { border:1px solid #e0e5ec; border-radius:17px; padding:17px 14px; background:#f1f3f7; margin:18px 0 24px; }
.ratio-division h3 { font-size:14px; }
.ratio-split-diagram { display:grid; grid-template-columns:minmax(0,1fr) 32px minmax(0,1fr); align-items:center; gap:3px; }
.ratio-split-source { background:#fff; border:1px solid #d9e1e9; border-radius:12px; padding:14px 6px; text-align:center; }
.ratio-split-source > span { font-size:10px; color:#7d8b9b; }
.ratio-split-source b { font-size:10px; display:block; color:#6d8097; margin:5px 0; }
.ratio-split-source strong { font-size:17px; display:block; color:#566d86; }
.ratio-split-source small,.ratio-split-target small { font-size:10px; font-weight:500; margin-left:3px; }
.ratio-split-links { display:block; width:32px; height:140px; }
.ratio-split-destinations { display:grid; gap:12px; }
.ratio-split-target { border:1px solid var(--division-color); border-left-width:3px; background:white; border-radius:10px; padding:10px 7px; color:var(--division-color); }
.ratio-split-target span { font-size:10px; display:block; }
.ratio-split-target strong { font-size:17px; display:block; margin-top:3px; }
.ratio-overview-section { margin-top:26px; }
.ratio-table-card { background:white; border:1px solid var(--line); border-radius:17px; overflow:hidden; }
.ratio-overview-table { border-collapse:collapse; width:100%; table-layout:fixed; font-variant-numeric:tabular-nums; }
.ratio-overview-table caption { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; }
.ratio-col-month { width:14%; }
.ratio-col-number { width:18%; }
.ratio-col-other { width:32%; }
.ratio-overview-table thead th { font-size:11px; color:#718072; background:#eef2e8; padding:11px 1px; line-height:1.6; font-weight:650; }
.ratio-overview-table small { display:block; font-weight:400; font-size:9px; color:#879387; line-height:1.6; }
.ratio-overview-table tbody tr { border-top:1px solid #eef1e9; }
.ratio-overview-table tbody tr:nth-child(even) { background:#fafbf8; }
.ratio-overview-table tbody th,.ratio-overview-table tbody td { padding:12px 1px; text-align:center; vertical-align:middle; }
.ratio-overview-table tbody th strong { font-size:12px; }
.ratio-number strong { font-size:12px; letter-spacing:-.35px; font-weight:650; white-space:nowrap; }
.ratio-han strong { color:#32694d; }
.ratio-min strong { color:#4f85a4; }
.ratio-overview-table .ratio-separated-row { background:#f6f3f9; }
.ratio-split-cell > div { display:flex; align-items:baseline; justify-content:center; gap:3px; color:var(--split-color); margin:4px 0; flex-wrap:wrap; }
.ratio-split-cell span { font-size:9px; }
.ratio-split-cell strong { font-size:11px; letter-spacing:-.3px; }
.ratio-split-cell small { flex-basis:100%; margin-top:-3px; }
.ratio-table-note { font-size:10px; line-height:1.8; color:#7c897b; margin:12px 2px; }
@media(min-width:600px) { .ratio-overview-table th,.ratio-overview-table td { padding-top:16px; padding-bottom:16px; } .ratio-number strong { font-size:14px; } .ratio-split-cell strong { font-size:13px; } .ratio-overview-legend span { font-size:12px; } }
.data-tools { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 18px 0; font-size:10px; color:var(--muted); }
.data-tools > span { min-width:0; overflow-wrap:anywhere; }
.data-tools button,.retry-button { border:1px solid #d7e2d2; color:var(--ink); background:white; border-radius:10px; padding:10px; min-height:40px; font-size:11px; cursor:pointer; flex-shrink:0; }
.data-tools button:disabled { opacity:.5; cursor:wait; }
.load-error p { font-size:13px; color:var(--muted); }
@media(min-width:600px) { .data-tools { padding-left:28px; padding-right:28px; } }
</style>
</head>
<body><div class="app"><header><small>GYEONGGI REGIONAL HEADQUARTERS</small><h1>현장의 숫자를, 한눈에.</h1><p>경기지역본부 채용비율 현황</p><div class="tag" id="data-period">첫 번째 시트</div></header><div class="data-tools"><span id="sync-status" role="status">데이터 연결 중…</span><button id="refresh-data" type="button">데이터 새로고침</button></div><main id="main"><div class="empty" role="status">현황 데이터를 불러오는 중…</div></main><nav aria-label="현황 분류"></nav></div>
<script>
'use strict';
let DATA = null;
let SEMICONDUCTOR = null;
let CURRENT_RATIO = null;
const COLORS = ['#32694d', '#6095b3', '#a491c1', '#c29a45', '#a0b488', '#bfc6c3'];
const MODES = [
  ['all', '전체', '26년 신규채용비율', '<path d="M4 20V10h4v10m2 0V4h4v16m2 0v-7h4v7M2 21h20"/>'],
  ['month', '월별', '월별신규채용추이', '<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v5m10-5v5M3 11h18"/>'],
  ['branch', '지부별', '지부별 채용 현황', '<path d="M4 21V5l8-3 8 3v16M2 21h20M8 8h2m4 0h2M8 12h2m4 0h2M10 21v-5h4v5"/>'],
  ['rental', '임대사별', '임대사별 채용현황', '<path d="M3 21V9h8v12M11 21V3h10v18M1 21h22M6 12h2m-2 4h2m6-9h4m-4 4h4m-4 4h4"/>'],
  ['semiconductor', '반도체', '반도체 현장 현황', '<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4m6-4v4M9 18v4m6-4v4M2 9h4m-4 6h4m12-6h4m-4 6h4M10 10h4v4h-4z"/>'],
  ['current-ratio', '전체비율', '월별 전체채용비율', '<path d="M3 3v18h18M6 15l5-5 4 3 6-8"/><circle cx="11" cy="10" r="1"/><circle cx="15" cy="13" r="1"/>']
];
let mode = 'all';
let selected = null;
let query = '';
let semiconductorSection = 'active';
let semiconductorRentalQuery = '';
const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const pct = (n, total) => total ? (n / total * 100).toFixed(1) : '0.0';
function aggregate(rows, categories = DATA.categories) {
  return {
    total: rows.reduce((sum, r) => sum + r.total, 0),
    counts: categories.map(c => rows.reduce((sum, r) => sum + r.counts[c], 0))
  };
}
const countOf = (a, category) => a.counts[DATA.categories.indexOf(category)];
function companyStatus(a) {
  if (a.total <= 0) return null;
  const han = countOf(a, '한노');
  if (han * 100 >= a.total * 40) return {label: '우호업체', kind: 'friendly'};
  if (han * 100 <= a.total * 30) return {label: '비협조업체', kind: 'uncooperative'};
  return null;
}
function statusBadge(a) {
  const status = companyStatus(a);
  return status ? `<span class="company-status ${status.kind}">${status.label}</span>` : '';
}
function sourceNotice(a, rows) {
  const sum = a.counts.reduce((s, n) => s + n, 0);
  const notes = rows.filter(r => Object.values(r.counts).reduce((s, n) => s + n, 0) !== r.total && r.note).map(r => `${esc(r.site)}: ${esc(r.note)}`).join('<br>');
  return sum !== a.total ? `<div class="notice"><p>원본 확인 · 총대수 ${a.total}대 / 소속 합계 ${sum}대</p><p>소속 비율 합계 ${pct(sum, a.total)}%. 원본 수치를 유지했습니다.</p>${notes ? `<p>${notes}</p>` : ''}</div>` : '';
}
function summary(rows, categories = DATA.categories) {
  const a = aggregate(rows, categories);
  const han = countOf(a, '한노');
  const stats = mode === 'rental'
    ? `<div class="rental-summary"><div class="stat-label"><i class="dot" style="background:${COLORS[0]}"></i>한노</div><div class="rental-value">${han}<small>대</small><span>(${pct(han, a.total)}%)</span></div></div>`
    : `<div class="stack" aria-hidden="true">${a.counts.map((n, i) => `<span style="background:${COLORS[i]};flex:${n}"></span>`).join('')}</div><div class="stats">${categories.map((c, i) => `<div><div class="stat-label"><i class="dot" style="background:${COLORS[i]}"></i>${c}</div><div class="stat-value">${a.counts[i]}<small>대 · ${pct(a.counts[i], a.total)}%</small></div></div>`).join('')}</div>`;
  return `<div class="card"><div class="total"><div><div class="eyebrow">TOTAL EQUIPMENT</div><strong>${a.total}<small>대</small></strong><p class="sub">${mode === 'semiconductor' ? '반도체 현장만 100% 기준' : '총대수 기준 100%'}</p></div><div class="summary-tags"><span class="pill">현장 기록 ${rows.length}건</span>${mode === 'rental' ? statusBadge(a) : ''}</div></div>${stats}${sourceNotice(a, rows)}</div>`;
}
function statisticPanel(id, title, rows, description, categories = DATA.categories) {
  return `<section class="statistic-panel" data-statistic="${id}" aria-labelledby="${id}-title"><div class="statistic-heading"><h2 id="${id}-title">${title}</h2><p>${description}</p></div>${summary(rows, categories)}</section>`;
}
function site(r, semiconductor = false) {
  const assigned = semiconductor && semiconductorSection === 'assigned';
  const label = semiconductor ? assigned ? '배정 완료' : '반도체 현장' : `${r.month}월 · ${esc(r.branch)}`;
  const categories = semiconductor ? SEMICONDUCTOR.categories : DATA.categories;
  return `<article class="card"><div class="site-top"><span class="badge ${semiconductor ? assigned ? 'assigned-label' : 'semiconductor-label' : ''}">${label}</span><span>총 <b>${r.total}대</b></span></div><h3 class="site-name">${esc(r.site)}</h3><div class="meta"><span>원청사</span><span>${esc(r.contractor || '미기재')}</span><span>임대사</span><span>${esc(r.rental || '미기재')}</span></div><div class="site-counts">${categories.map((c, i) => `<div><i class="dot" style="background:${COLORS[i]}"></i> ${c}<b>${r.counts[c]}대 <small>${pct(r.counts[c], r.total)}%</small></b></div>`).join('')}</div>${r.note ? `<p class="note">※ ${esc(r.note)}</p>` : ''}</article>`;
}
function groupKeys() {
  return mode === 'month' ? DATA.months : [...new Set(DATA.records.map(r => r[mode]))].sort((a, b) => a.localeCompare(b, 'ko'));
}
const matching = key => DATA.records.filter(r => r[mode] === key);
function matchingQuery(rows) {
  const q = query.trim().toLocaleLowerCase();
  return rows.filter(r => [r.site, r.contractor, r.rental, r.branch].some(v => String(v ?? '').toLocaleLowerCase().includes(q)));
}
function groupMetrics(a) {
  const han = countOf(a, '한노');
  const min = countOf(a, '민노');
  const hanText = mode === 'branch' ? `${pct(han, a.total)}%` : `${han}대 (${pct(han, a.total)}%)`;
  return `<span class="group-metric han">한노 <strong>${hanText}</strong></span>${mode !== 'rental' ? `<span class="group-metric min">민노 <strong>${pct(min, a.total)}%</strong></span>` : ''}`;
}
function drawGroups() {
  const host = document.getElementById('groups');
  if (!host) return;
  host.innerHTML = groupKeys().map((key, i) => {
    const rows = matching(key);
    if (!matchingQuery(rows).length) return '';
    const a = aggregate(rows);

function validateCurrentRatioData(data) {
  const categories = ['한노', '민노', '섬유', '연합', '기타노조 미분리', '직원'];
  if (!data || !Number.isInteger(data.year) || !data.basis || data.basis.unknownExcluded !== true ||
      !Number.isInteger(data.basis.separatedFromMonth) || data.basis.separatedFromMonth < 1 || data.basis.separatedFromMonth > 12 ||
      !Array.isArray(data.categories) || data.categories.length !== categories.length ||
      !categories.every((c, i) => data.categories[i] === c) || !Array.isArray(data.records) || !data.records.length) {
    throw new Error('월별 전체채용비율 JSON 형식을 확인해 주세요.');
  }
  const months = new Set();
  for (const r of data.records) {
    if (!r || !Number.isInteger(r.month) || r.month < 1 || r.month > 12 || months.has(r.month) ||
        !Number.isInteger(r.total) || r.total <= 0 || !r.counts || !r.reportedPercentages || typeof r.note !== 'string') {
      throw new Error('월별 전체채용비율 기록을 확인해 주세요.');
    }
    for (const c of categories) {
      const count = r.counts[c], reported = r.reportedPercentages[c];
      const unseparated = (c === '섬유' || c === '연합') && r.month < data.basis.separatedFromMonth;
      if (unseparated ? count !== null || reported !== null : !Number.isInteger(count) || count < 0 || !Number.isFinite(reported) || reported < 0) {
        throw new Error('월별 소속 수치와 미분리 항목을 확인해 주세요.');
      }
    }
    months.add(r.month);
  }
  return data;
}
function validateData(data) {
  const categories = ['한노', '민노', '섬유', '연합', '직원', '미정'];
  if (!data || !Number.isInteger(data.year) || !Array.isArray(data.months) || !data.months.length ||
      !data.months.every(m => Number.isInteger(m) && m >= 1 && m <= 12) ||
      new Set(data.months).size !== data.months.length ||
      !Array.isArray(data.categories) || data.categories.length !== categories.length ||
      !categories.every((c, i) => data.categories[i] === c) || !Array.isArray(data.records)) {
    throw new Error('JSON 형식을 확인해 주세요.');
  }
  const ids = new Set();
  for (const r of data.records) {
    if (!r || r.id == null || ids.has(r.id) || !data.months.includes(r.month) ||
        !Number.isInteger(r.total) || r.total < 0 ||
        !['site', 'contractor', 'rental', 'branch', 'note'].every(k => typeof r[k] === 'string') ||
        !r.counts || !categories.every(c => Number.isInteger(r.counts[c]) && r.counts[c] >= 0)) {
      throw new Error('JSON 현장 기록을 확인해 주세요.');
    }
    ids.add(r.id);
  }
  return data;
}
function validateSemiconductorData(data, mainCategories = DATA.categories) {
  if (!data || typeof data.sheet !== 'string' ||
      !Array.isArray(data.categories) || data.categories.length !== mainCategories.length ||
      !data.categories.every((c, i) => c === mainCategories[i]) ||
      !Array.isArray(data.records) || !Array.isArray(data.assignedRecords)) {
    throw new Error('반도체 JSON 형식을 확인해 주세요.');
  }
  const ids = new Set();
  for (const rows of [data.records, data.assignedRecords]) {
    for (const r of rows) {
      if (!r || r.id == null || ids.has(r.id) || !Number.isInteger(r.total) || r.total < 0 ||
          !['site', 'contractor', 'rental', 'note'].every(k => typeof r[k] === 'string') ||
          !r.counts || !data.categories.every(c => Number.isInteger(r.counts[c]) && r.counts[c] >= 0)) {
        throw new Error('반도체 현장 기록을 확인해 주세요.');
      }
      ids.add(r.id);
    }
  }
  return data;
}
const DATA_FILES = [

  {path: './data/02_반도체.json', label: '반도체'},
  {path: './data/03_전체비율.json', label: '전체비율'}

let loadingData = false;
let loadedSignature = '';
async function fetchDataset(file, signal) {

    response = await fetch(new URL(file.path, document.baseURI), {cache: 'no-store', signal});
  } catch (error) {
    throw new Error(`${file.label} 데이터를 불러오지 못했습니다. 연결을 확인해 주세요.`);
  }
  if (!response.ok) throw new Error(`${file.label} 데이터를 불러오지 못했습니다. (HTTP ${response.status})`);
  try {
    return await response.json();
  } catch (error) {
    throw new Error(`${file.label} JSON 형식을 확인해 주세요.`);
  }
}
function validateDataset(label, validator) {
  try { return validator(); }
  catch (error) { throw new Error(`${label} 데이터 확인이 필요합니다. ${error.message}`); }
}
async function loadData() {
  if (loadingData) return;

  const refresh = document.getElementById('refresh-data');
  refresh.disabled = true;

    const signature = JSON.stringify([nextMain, nextSemiconductor, nextCurrentRatio]);

      const focusedId = input?.tagName === 'INPUT' ? input.id : null;
      const selection = focusedId ? [input.selectionStart, input.selectionEnd] : null;
      const scrollTop = window.scrollY;

        }

  } catch (error) {

    if (!DATA) {
      const message = location.protocol === 'file:'
        ? '이 화면은 웹주소로 열어야 합니다. HTML과 data 폴더를 같은 웹서버에 올린 뒤 접속해 주세요.'
        : error.message;
      document.getElementById('main').innerHTML = `<div class="card load-error"><h2>데이터 연결을 확인해 주세요</h2><p>${esc(message)}</p><button type="button" class="retry-button" data-retry>다시 시도</button></div>`;
    }

  }
}
document.getElementById('refresh-data').addEventListener('click', () => loadData());
document.addEventListener('click', event => { if (event.target.closest('[data-retry]')) loadData(); });
loadData();
